<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#050505">
	<meta name="color-scheme" content="dark">
	<meta name="robots" content="noindex">
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon.png">
	<title>404 — Sasha Kuznetsov</title>
	<style>
		:root {
			--bg: #050505;
			--ink: #f6f6f0;
			--ink-soft: rgba(246, 246, 240, 0.68);
			--ink-faint: rgba(246, 246, 240, 0.48);
			--rule: rgba(246, 246, 240, 0.10);
			--mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
			--serif: "Fraunces", Georgia, serif;
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			min-height: 100vh;
			background: var(--bg);
			color: var(--ink);
			font-family: var(--serif);
			display: grid;
			place-items: center;
			padding: 2rem;
			-webkit-font-smoothing: antialiased;
		}
		main {
			max-width: 34rem;
			width: 100%;
			border-top: 1px solid var(--rule);
			padding-top: 2rem;
		}
		.code {
			font-family: var(--mono);
			font-size: 11px;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			color: var(--ink-faint);
		}
		h1 {
			margin: 0.75rem 0 0;
			font-size: clamp(2rem, 6vw, 3rem);
			font-weight: 400;
			letter-spacing: -0.025em;
			line-height: 1.1;
		}
		p {
			margin: 1rem 0 2rem;
			color: var(--ink-soft);
			font-size: 1.05rem;
			line-height: 1.55;
		}
		a {
			display: inline-flex;
			align-items: center;
			min-block-size: 40px;
			padding: 0.45rem 0.9rem;
			border: 1px solid var(--rule);
			border-radius: 999px;
			color: var(--ink);
			text-decoration: none;
			font-family: var(--mono);
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			transition: border-color 0.2s ease, background 0.2s ease;
		}
		a:hover, a:focus-visible {
			border-color: var(--ink);
			background: rgba(246, 246, 240, 0.06);
			outline: none;
		}
	</style>
</head>
<body>
	<main>
		<span class="code">404 / Not Found</span>
		<h1>Nothing at this address.</h1>
		<p>This page doesn’t exist. Head back to the directory to browse all projects.</p>
		<a href="/">← Back to directory.skz.dev</a>
	</main>
</body>
</html>
